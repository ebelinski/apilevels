# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Android API Levels
description: A quick reference table of Android versions with SDK & API levels, version codes, codenames, cumulative usage, and more.
author: Eugene Belinski

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://apilevels.com" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - manifest.json
  - usage_reporter.py
  - meta/
