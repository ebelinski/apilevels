name: Update usage figures

on:
  schedule:
    - cron: "0 12 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Update index.md
        run: python usage_reporter.py update
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-usage-figures
          commit-message: Update cumulative usage figures.
          title: Update cumulative usage figures
          body: Monthly update of the cumulative usage figures from Statcounter GlobalStats, generated by `usage_reporter.py`.
          delete-branch: true
